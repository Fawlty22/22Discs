<div class="container">
  <h1>Disc Search</h1>

  <mat-dialog-content class="dialog-content">
    <div class="search-bar">
      <mat-form-field class="search-input" subscriptSizing="dynamic">
        <mat-label>Disc Name</mat-label>
        <input
          matInput
          [(ngModel)]="discName"
          (keyup.enter)="searchForDisc()"
        />
      </mat-form-field>
      <button mat-mini-fab color="accent" (click)="searchForDisc()">
        <mat-icon color="primary">search</mat-icon>
      </button>
    </div>

    @if (!searched){
    <p class="info-text">Search for a disc to add to your collection!</p>
    } @if(searched && results.length > 0){
    <ul class="results-list">
      @for(disc of results; track disc.id){
      <li class="result-item">
        <span
          ><b>{{ disc.name }}</b> | {{ disc.brand }}</span
        >
        <button
          mat-icon-button
          color="accent"
          (click)="addDiscToCollection(disc)"
        >
          <mat-icon>add</mat-icon>
        </button>
      </li>
      }
    </ul>
    } @if(searched && results.length === 0){
    <p class="info-text">No results found. Try again...</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-flat-button
      [mat-dialog-close]="collection"
      cdkFocusInitial
      color="warn"
    >
      Close
    </button>
  </mat-dialog-actions>
</div>
